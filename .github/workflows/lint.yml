name: Static Analysis (Reviewdog)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Run Ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review # PR 리뷰 댓글로 표시
          android: true # Android 스타일 가이드 준수
          fail_on_error: true # 에러 발견 시 빌드 실패
          level: warning # Warning 이상은 댓글로 표시
          ktlint_version: "1.8.0"

  android-lint:
    name: Check Project Issues (Android Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # google-services plugin 이 app/google-services.json 을 요구. 파일은 .gitignore 라
      # CI 환경엔 없음. Android Lint 는 실제 Firebase 가 불필요하므로 stub JSON 생성
      # (plugin 통과 목적, secret 비의존).
      - name: Create stub google-services.json (CI only)
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "hackathon-ci-stub",
              "storage_bucket": "hackathon-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.hackathon"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDfake_ci_only_no_real_value_xxxxxxxxxxx" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue --parallel

      # 모듈별 lint XML 을 한 파일로 합쳐 Reviewdog 가 PR 인라인 코멘트로 띄우도록 한다.
      # 단일 :app 모듈이면 app 의 XML 하나만 합쳐지지만, 추후 모듈 추가 시에도 그대로 동작.
      - name: Merge module lint XMLs into one
        if: always()
        run: |
          set -e
          out=app/build/reports/lint-results-merged.xml
          mkdir -p app/build/reports
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<issues format="6" by="lint" client="gradle" type="baseline" name="merged">'
            find . -path '*/build/reports/lint-results-debug.xml' -print | while read -r xml; do
              xmllint --xpath '//issue' "$xml" 2>/dev/null || true
            done
            echo '</issues>'
          } > "$out"
          modules=$(find . -path '*/build/reports/lint-results-debug.xml' | wc -l)
          issues=$(grep -c '<issue ' "$out" || echo 0)
          echo "merged $issues issues from $modules modules → $out"

      - name: Report Android Lint (Reviewdog)
        if: always()
        uses: dvdandroid/action-android-lint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          lint_xml_file: app/build/reports/lint-results-merged.xml
