name: Unit Test

# PR 대상 main 일 때 JVM unit test (./gradlew testDebugUnitTest) 실행.
# lint.yml 과 setup 이 거의 동일하지만 분리 — lint 실패가 test 결과를 가리지 않도록 fail-fast 독립.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # google-services plugin 이 app/google-services.json 을 요구. 파일은 .gitignore 라 CI 엔 없음.
      # unit test 는 실제 Firebase 가 불필요하므로 stub JSON 생성 (plugin 통과 목적, secret 비의존).
      - name: Create stub google-services.json (CI only)
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "hackathon-ci-stub",
              "storage_bucket": "hackathon-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.hackathon"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDfake_ci_only_no_real_value_xxxxxxxxxxx" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue --parallel

      # 실패한 테스트의 HTML/XML 리포트를 PR artifact 로 보존 — CI 로그에서 stack trace 추적이 빠름.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest
          retention-days: 7
